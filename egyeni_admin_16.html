<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>16 Fős Egyéni Teke - Adminisztráció</title>
<style>
    body { font-family: sans-serif; background: #121212; color: white; padding: 15px; margin: 0; }
    .header-panel { margin-bottom: 20px; text-align: center; }
    .header-panel input {
        font-size: 1.4rem; padding: 8px 12px; width: 80%; max-width: 500px;
        background: #2a2a2a; border: 2px solid #3fb950; color: #ffff00;
        font-weight: bold; border-radius: 6px; text-align: center;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 12px; }
    .card { background: #1e1e1e; padding: 10px; border-radius: 6px; border: 1px solid #333; }
    .card-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: bold; color: #8b949e; }
    .row { display: flex; gap: 5px; align-items: center; margin-bottom: 6px; }
    input[type="text"].p-name { flex: 1; background: #2a2a2a; border: 1px solid #444; color: white; padding: 6px; border-radius: 4px; font-weight: bold; }
    input[type="text"].p-club { flex: 1; background: #2a2a2a; border: 1px solid #444; color: #3fb950; padding: 6px; border-radius: 4px; }
    .stats-inputs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; background: #252525; padding: 6px; border-radius: 4px; }
    .set-box { display: flex; flex-direction: column; gap: 3px; background: #1a1a1a; padding: 4px; border-radius: 4px; text-align: center; }
    .set-box label { font-size: 0.75rem; color: #3fb950; font-weight: bold; }
    .set-box input { width: 90%; background: #2a2a2a; border: 1px solid #444; color: white; padding: 4px 0; text-align: center; border-radius: 3px; font-size: 0.85rem; margin: 0 auto; }
</style>

<!-- Firebase SDK-k -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="header-panel">
    <input type="text" id="tournamentTitle" value="16 Fős Egyéni Bajnokság" placeholder="Bajnokság / Verseny Neve" oninput="sendData()">
</div>

<div class="grid" id="playersContainer"></div>

<script>
const firebaseConfig = {
    apiKey: "aizasyd8o7xyctxtjlqcm8z-29xtbopbxrybjom",
    authDomain: "teke-eredmenyek.firebaseapp.com",
    databaseURL: "https://teke-eredmenyek-default-rtdb.firebaseio.com",
    projectId: "teke-eredmenyek",
    storageBucket: "teke-eredmenyek.appspot.com"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}
const db = firebase.database();

const totalPlayers = 16;

function init() {
    const container = document.getElementById('playersContainer');
    container.innerHTML = '';
    for (let i = 0; i < totalPlayers; i++) {
        container.innerHTML += `
            <div class="card" data-idx="${i}">
                <div class="card-header">
                    <span>#${i + 1} Játékos</span>
                </div>
                <div class="row">
                    <input type="text" class="p-name" placeholder="Játékos neve" oninput="sendData()">
                    <input type="text" class="p-club" placeholder="Egyesület" oninput="sendData()">
                </div>
                <div class="stats-inputs">
                    ${[0,1,2,3].map(s => `
                        <div class="set-box">
                            <label>S${s+1}</label>
                            <input type="number" class="p-teli${s}" placeholder="Teli" oninput="sendData()">
                            <input type="number" class="p-tarol${s}" placeholder="Tar" oninput="sendData()">
                            <input type="number" class="p-ures${s}" placeholder="Üres" oninput="sendData()">
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    }

    loadData();
}

function loadData() {
    db.ref('egyeni_16_bowling').once('value').then(snapshot => {
        const data = snapshot.val();
        if (!data) return;

        if (data.title) {
            document.getElementById('tournamentTitle').value = data.title;
        }

        if (data.players && Array.isArray(data.players)) {
            const cards = document.querySelectorAll('.card');
            data.players.forEach((player, idx) => {
                if (cards[idx]) {
                    const card = cards[idx];
                    
                    // Név és Egyesület visszaállítása
                    if (player.name && !player.name.startsWith("Játékos ")) {
                        card.querySelector('.p-name').value = player.name;
                    }
                    if (player.club && player.club !== '-') {
                        card.querySelector('.p-club').value = player.club;
                    }

                    // Részletes szett adatok visszaállítása
                    if (player.rawSets) {
                        player.rawSets.forEach((sData, sIdx) => {
                            if (sData) {
                                card.querySelector(`.p-teli${sIdx}`).value = sData.teli !== undefined && sData.teli !== 0 ? sData.teli : '';
                                card.querySelector(`.p-tarol${sIdx}`).value = sData.tarol !== undefined && sData.tarol !== 0 ? sData.tarol : '';
                                card.querySelector(`.p-ures${sIdx}`).value = sData.ures !== undefined && sData.ures !== 0 ? sData.ures : '';
                            }
                        });
                    }
                }
            });
        }
    });
}

function sendData() {
    const title = document.getElementById('tournamentTitle').value || '16 Fős Egyéni Bajnokság';
    const players = [];
    const cards = document.querySelectorAll('.card');

    cards.forEach((card, idx) => {
        const name = card.querySelector('.p-name').value;
        const club = card.querySelector('.p-club').value;
        let totalTeli = 0, totalTarol = 0, totalUres = 0;
        const sets = [];
        const rawSets = [];

        for (let s = 0; s < 4; s++) {
            const teliVal = card.querySelector(`.p-teli${s}`).value;
            const tarolVal = card.querySelector(`.p-tarol${s}`).value;
            const uresVal = card.querySelector(`.p-ures${s}`).value;

            const teli = parseInt(teliVal) || 0;
            const tarol = parseInt(tarolVal) || 0;
            const ures = parseInt(uresVal) || 0;

            totalTeli += teli;
            totalTarol += tarol;
            totalUres += ures;
            
            sets.push(teli + tarol);

            rawSets.push({
                teli: teliVal !== '' ? teli : 0,
                tarol: tarolVal !== '' ? tarol : 0,
                ures: uresVal !== '' ? ures : 0
            });
        }

        players.push({
            id: idx + 1,
            name: name || `Játékos ${idx + 1}`,
            club: club || '-',
            sets: sets,
            rawSets: rawSets,
            teli: totalTeli,
            tarol: totalTarol,
            ures: totalUres,
            total: totalTeli + totalTarol
        });
    });

    db.ref('egyeni_16_bowling').set({
        title: title,
        players: players
    });
}

init();
</script>
</body>
</html>
